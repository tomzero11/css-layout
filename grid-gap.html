<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self</title>
    <style>
        .container {
            display: grid;
            background-color: yellow;
            padding: 10px;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 100px 100px;
            width: 1300px;
            height: 1000px;
            gap: 10px 60px;
        }
        .content {
            background-color: blue;
            text-align: center;
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content content1">
            1
        </div>
        <div class="content">
            2
        </div>
        <div class="content">
            3
        </div>
        <div class="content">
            4

        </div>
    </div>
</body>
</html>
