<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Item Grow</title>
    <style>
        .container {
            display: flex;
        }
        .content1, .content2, .content3, .content4 {
            border: 4px solid ;
            padding: 10px;
            margin: 10px;
            background-color: black;
            color: white;
            font-size: 2em;
            width: 100px;
            text-align: center;
        }
        .content1 {
            flex-grow: 1;
        }
        .content2 {
            flex-grow: 2;
        }
        .content3 {
            flex-grow: 1;
        }
        .content4 {
            flex-grow: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content1"">
            <p>1</p>
        </div>
        <div class="content2"">
            <p>2</p>
        </div>
        <div class="content3"">
            <p>3</p>
        </div>
        <div class="content4"">
            <p>4</p>
        </div>
    </div>
</body>
</html>
